    <script>
      // Compatibility patch: ensure window.fetch has both getter and setter
      // to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return originalFetch;
              },
              set: function(fn) {
                originalFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
